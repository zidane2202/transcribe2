<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech → Transcription</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.2rem; font-weight: 500; color: #c8c8e0; margin-bottom: 2rem; }
    .btn-record {
      width: 100%; padding: 1rem; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    }
    .btn-record.idle { background: #5a4fcf; color: #fff; }
    .btn-record.idle:hover { background: #6a5fdf; }
    .btn-record.recording { background: #cf4f5a; color: #fff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.75} }
    .status { margin-top: 1.25rem; font-size: 0.82rem; color: #8888aa; text-align: center; min-height: 1.2rem; }
    .result-box {
      margin-top: 1.5rem; background: #0f0f18; border: 1px solid #2a2a3a;
      border-radius: 10px; padding: 1rem; font-size: 0.9rem; line-height: 1.6;
      color: #d0d0e8; white-space: pre-wrap; display: none;
    }
    .result-box.visible { display: block; }
    .actions { margin-top: 0.75rem; display: none; gap: 0.5rem; flex-wrap: wrap; }
    .actions.visible { display: flex; }
    .action-btn {
      background: none; border: 1px solid #2a2a3a; color: #8888aa;
      border-radius: 6px; padding: 0.4rem 0.9rem; font-size: 0.78rem;
      cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { border-color: #5a4fcf; color: #c8c8e0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙 Speech → Transcription</h1>

    <button class="btn-record idle" id="recordBtn" onclick="toggleRecording()">
      <span class="dot"></span>
      <span id="btnLabel">Commencer l'enregistrement</span>
    </button>

    <div class="status" id="status">En attente…</div>
    <div class="result-box" id="resultBox"></div>
    <div class="actions" id="actions">
      <button class="action-btn" onclick="copyText()">📋 Copier</button>
      <button class="action-btn" onclick="downloadTxt()">📄 Télécharger .txt</button>
    </div>
  </div>

  <script>
    // Colle ta clé Groq ici
    const GROQ_API_KEY = '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';

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let lastText = '';

    async function toggleRecording() {
      if (!isRecording) await startRecording();
      else stopRecording();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = transcribe;
        mediaRecorder.start();
        isRecording = true;
        setUI('recording');
        setStatus('🔴 Enregistrement en cours…');
      } catch (err) {
        setStatus('❌ Micro refusé : ' + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      isRecording = false;
      setUI('idle');
      setStatus('⏳ Transcription en cours…');
    }

    async function transcribe() {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const form = new FormData();
      form.append('file', blob, 'audio.webm');
      form.append('model', 'whisper-large-v3-turbo');
      form.append('language', 'fr');
      form.append('response_format', 'json');

      try {
        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + GROQ_API_KEY },
          body: form
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        lastText = data.text || '';
        showResult(lastText);
        setStatus('✅ Transcription reçue.');
      } catch (err) {
        setStatus('❌ Erreur : ' + err.message);
      }
    }

    function setUI(state) {
      const btn = document.getElementById('recordBtn');
      const label = document.getElementById('btnLabel');
      btn.className = 'btn-record ' + state;
      label.textContent = state === 'recording' ? "Arrêter l'enregistrement" : "Commencer l'enregistrement";
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    function showResult(text) {
      const box = document.getElementById('resultBox');
      box.textContent = text;
      box.classList.add('visible');
      document.getElementById('actions').classList.add('visible');
    }

    function copyText() {
      navigator.clipboard.writeText(lastText).then(() => setStatus('✅ Copié dans le presse-papiers.'));
    }

    function downloadTxt() {
      const a = document.createElement('a');
      a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(lastText);
      a.download = 'transcription-' + new Date().toISOString().slice(0,10) + '.txt';
      a.click();
    }
  </script>
</body>
</html>
